    <rect x="1110" y="18" width="60" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="1122" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B" font-weight="700">LIVE</text>
    
    <!-- Main Content Area -->
