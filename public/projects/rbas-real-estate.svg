    <text x="218" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8" font-weight="500">https://reaestate.vercel.app</text>
    
    <!-- Action icons placeholder -->
    <rect x="1040" y="18" width="20" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="1075" y="18" width="20" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="1110" y="18" width="60" height="20" rx="4" fill="#C5A059" fill-opacity="0.2"/>
    <text x="1122" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#C5A059" font-weight="700">LIVE</text>
    
    <!-- Main Content Area -->
    <g transform="translate(0, 56)">
      
  <rect width="1200" height="694" fill="#0A0D14"/>
  <!-- Nav -->
  <g transform="translate(60, 24)">
